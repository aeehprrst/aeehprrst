
name: Generate Futuristic Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate futuristic snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: aeehprrst
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#59E7FF&color_dots=#0D1321,#172447,#233F70,#674FB8,#A789FF
            dist/snake-light.svg?palette=github-light&color_snake=#674FB8&color_dots=#EFF6FF,#CDE8FF,#9DCDF9,#8D91F1,#674FB8

      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
